<svg viewBox="0 0 1400 1040" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
<rect x="0" y="0" width="1400" height="1040" fill="white"/>
<text x="700" y="24" text-anchor="middle" font-size="18" font-weight="700" fill="#23262b">Sequence Diagram — Booking a Seat (Cinema Ticket Booking System)</text>
<rect x="20.0" y="40" width="160" height="50" rx="6" fill="#f6f6f4" stroke="#3a3f47" stroke-width="1.3"/>
<text x="100" y="63.0" text-anchor="middle" font-size="12.5" font-weight="600" fill="#23262b">Customer</text>
<text x="100" y="78.0" text-anchor="middle" font-size="12.5" font-weight="600" fill="#23262b">(Web / CLI client)</text>
<line x1="100" y1="90" x2="100" y2="985" stroke="#6b7280" stroke-width="1.2" stroke-dasharray="4,4"/>
<rect x="210.0" y="40" width="160" height="50" rx="6" fill="#f6f6f4" stroke="#3a3f47" stroke-width="1.3"/>
<text x="290" y="70.0" text-anchor="middle" font-size="12.5" font-weight="600" fill="#23262b">API Gateway</text>
<line x1="290" y1="90" x2="290" y2="985" stroke="#6b7280" stroke-width="1.2" stroke-dasharray="4,4"/>
<rect x="400.0" y="40" width="160" height="50" rx="6" fill="#f6f6f4" stroke="#3a3f47" stroke-width="1.3"/>
<text x="480" y="70.0" text-anchor="middle" font-size="12.5" font-weight="600" fill="#23262b">Auth Service</text>
<line x1="480" y1="90" x2="480" y2="985" stroke="#6b7280" stroke-width="1.2" stroke-dasharray="4,4"/>
<rect x="590.0" y="40" width="160" height="50" rx="6" fill="#f6f6f4" stroke="#3a3f47" stroke-width="1.3"/>
<text x="670" y="70.0" text-anchor="middle" font-size="12.5" font-weight="600" fill="#23262b">Movie Service</text>
<line x1="670" y1="90" x2="670" y2="985" stroke="#6b7280" stroke-width="1.2" stroke-dasharray="4,4"/>
<rect x="780.0" y="40" width="160" height="50" rx="6" fill="#f6f6f4" stroke="#3a3f47" stroke-width="1.3"/>
<text x="860" y="70.0" text-anchor="middle" font-size="12.5" font-weight="600" fill="#23262b">Booking Service</text>
<line x1="860" y1="90" x2="860" y2="985" stroke="#6b7280" stroke-width="1.2" stroke-dasharray="4,4"/>
<rect x="970.0" y="40" width="160" height="50" rx="6" fill="#f6f6f4" stroke="#3a3f47" stroke-width="1.3"/>
<text x="1050" y="63.0" text-anchor="middle" font-size="12.5" font-weight="600" fill="#23262b">Notification</text>
<text x="1050" y="78.0" text-anchor="middle" font-size="12.5" font-weight="600" fill="#23262b">Service</text>
<line x1="1050" y1="90" x2="1050" y2="985" stroke="#6b7280" stroke-width="1.2" stroke-dasharray="4,4"/>
<rect x="1170.0" y="40" width="160" height="50" rx="6" fill="#f6f6f4" stroke="#3a3f47" stroke-width="1.3"/>
<text x="1250" y="63.0" text-anchor="middle" font-size="12.5" font-weight="600" fill="#23262b">Other Client</text>
<text x="1250" y="78.0" text-anchor="middle" font-size="12.5" font-weight="600" fill="#23262b">(Staff / another Customer)</text>
<line x1="1250" y1="90" x2="1250" y2="985" stroke="#6b7280" stroke-width="1.2" stroke-dasharray="4,4"/>
<rect x="70" y="100" width="1260" height="32" rx="4" fill="#f6f6f4" stroke="#6b7280" stroke-width="1" stroke-dasharray="3,3"/>
<text x="700" y="120.0" text-anchor="middle" font-size="11.5" fill="#6b7280" font-style="italic">Customer and Other Client already hold an open WebSocket connection to the Notification Service (opened once at login — see connectWebSocket()).</text>
<line x1="70" y1="158" x2="1330" y2="158" stroke="#d8dad5" stroke-width="1"/>
<text x="700" y="152" text-anchor="middle" font-size="12" font-weight="700" fill="#2f6f4f">1. Login</text>
<line x1="100" y1="180" x2="290" y2="180" stroke="#3a3f47" stroke-width="1.6"/>
<path d="M 290 180 L 279 175 L 279 185 Z" fill="#3a3f47"/>
<text x="195.0" y="174" text-anchor="middle" font-size="11.5" font-weight="600" fill="#23262b">POST /login  { username }</text>
<line x1="290" y1="214" x2="480" y2="214" stroke="#3a3f47" stroke-width="1.6"/>
<path d="M 480 214 L 469 209 L 469 219 Z" fill="#3a3f47"/>
<text x="385.0" y="208" text-anchor="middle" font-size="11.5" font-weight="600" fill="#23262b">POST /login</text>
<line x1="480" y1="248" x2="290" y2="248" stroke="#3a3f47" stroke-width="1.6" stroke-dasharray="6,4"/>
<path d="M 290 248 L 301 243 M 290 248 L 301 253" stroke="#3a3f47" stroke-width="1.6" fill="none"/>
<text x="385.0" y="242" text-anchor="middle" font-size="11.5" font-weight="400" fill="#6b7280">200 OK  { username }</text>
<line x1="290" y1="282" x2="100" y2="282" stroke="#3a3f47" stroke-width="1.6" stroke-dasharray="6,4"/>
<path d="M 100 282 L 111 277 M 100 282 L 111 287" stroke="#3a3f47" stroke-width="1.6" fill="none"/>
<text x="195.0" y="276" text-anchor="middle" font-size="11.5" font-weight="400" fill="#6b7280">200 OK  { username }</text>
<line x1="70" y1="322" x2="1330" y2="322" stroke="#d8dad5" stroke-width="1"/>
<text x="700" y="316" text-anchor="middle" font-size="12" font-weight="700" fill="#2f6f4f">2. Customer books a seat</text>
<line x1="100" y1="344" x2="290" y2="344" stroke="#3a3f47" stroke-width="1.6"/>
<path d="M 290 344 L 279 339 L 279 349 Z" fill="#3a3f47"/>
<text x="195.0" y="338" text-anchor="middle" font-size="11.5" font-weight="600" fill="#23262b">POST /bookings  { username, showtime_id, seat }</text>
<line x1="290" y1="378" x2="860" y2="378" stroke="#3a3f47" stroke-width="1.6"/>
<path d="M 860 378 L 849 373 L 849 383 Z" fill="#3a3f47"/>
<text x="575.0" y="372" text-anchor="middle" font-size="11.5" font-weight="600" fill="#23262b">POST /bookings</text>
<line x1="860" y1="412" x2="670" y2="412" stroke="#3a3f47" stroke-width="1.6"/>
<path d="M 670 412 L 681 407 L 681 417 Z" fill="#3a3f47"/>
<text x="765.0" y="406" text-anchor="middle" font-size="11.5" font-weight="600" fill="#23262b">GET /showtimes/{id}</text>
<line x1="670" y1="446" x2="860" y2="446" stroke="#3a3f47" stroke-width="1.6" stroke-dasharray="6,4"/>
<path d="M 860 446 L 849 441 M 860 446 L 849 451" stroke="#3a3f47" stroke-width="1.6" fill="none"/>
<text x="765.0" y="440" text-anchor="middle" font-size="11.5" font-weight="400" fill="#6b7280">200 OK  { showtime }</text>
<rect x="60" y="466" width="1280" height="468" fill="none" stroke="#8a5a00" stroke-width="1.4"/>
<path d="M 60 466 L 150 466 L 150 488 L 138 500 L 60 500 Z" fill="#fff8e6" stroke="#8a5a00" stroke-width="1.2"/>
<text x="72" y="488" font-size="12" font-weight="700" fill="#8a5a00">alt</text>
<text x="700" y="488" text-anchor="middle" font-size="12" font-weight="600" fill="#8a5a00">[ seat already taken ]</text>
<line x1="860" y1="524" x2="290" y2="524" stroke="#3a3f47" stroke-width="1.6" stroke-dasharray="6,4"/>
<path d="M 290 524 L 301 519 M 290 524 L 301 529" stroke="#3a3f47" stroke-width="1.6" fill="none"/>
<text x="575.0" y="518" text-anchor="middle" font-size="11.5" font-weight="400" fill="#6b7280">409 Conflict  { detail: "seat already taken" }</text>
<line x1="290" y1="558" x2="100" y2="558" stroke="#3a3f47" stroke-width="1.6" stroke-dasharray="6,4"/>
<path d="M 100 558 L 111 553 M 100 558 L 111 563" stroke="#3a3f47" stroke-width="1.6" fill="none"/>
<text x="195.0" y="552" text-anchor="middle" font-size="11.5" font-weight="400" fill="#6b7280">409 Conflict</text>
<line x1="60" y1="584" x2="1340" y2="584" stroke="#8a5a00" stroke-width="1" stroke-dasharray="6,4"/>
<text x="700" y="578" text-anchor="middle" font-size="12" font-weight="600" fill="#8a5a00">[ seat is free ]</text>
<path d="M 860 624 L 915 624 L 915 640 L 860 640" fill="none" stroke="#3a3f47" stroke-width="1.6"/>
<path d="M 860 640 L 871 635 M 860 640 L 871 645" stroke="#3a3f47" stroke-width="1.6" fill="none"/>
<text x="925" y="629" font-size="11.5" font-weight="600" fill="#23262b">save ticket (in memory)</text>
<line x1="860" y1="682" x2="1050" y2="682" stroke="#3a3f47" stroke-width="1.6"/>
<path d="M 1050 682 L 1039 677 L 1039 687 Z" fill="#3a3f47"/>
<text x="955.0" y="676" text-anchor="middle" font-size="11.5" font-weight="600" fill="#23262b">POST /notify  { event: "seat_taken", seat, showtime_id, ticket }</text>
<rect x="1030" y="708" width="240" height="26" rx="5" fill="#eaf3ee"/>
<line x1="1050" y1="724" x2="1250" y2="724" stroke="#2f6f4f" stroke-width="1.6"/>
<path d="M 1250 724 L 1239 719 M 1250 724 L 1239 729" stroke="#2f6f4f" stroke-width="1.6" fill="none"/>
<text x="1150.0" y="718" text-anchor="middle" font-size="11.5" font-weight="700" fill="#2f6f4f">WS push  { event: "seat_taken", seat, showtime_id }</text>
<text x="1320" y="728" font-size="15" fill="#2f6f4f">⚡</text>
<line x1="1050" y1="766" x2="860" y2="766" stroke="#3a3f47" stroke-width="1.6" stroke-dasharray="6,4"/>
<path d="M 860 766 L 871 761 M 860 766 L 871 771" stroke="#3a3f47" stroke-width="1.6" fill="none"/>
<text x="955.0" y="760" text-anchor="middle" font-size="11.5" font-weight="400" fill="#6b7280">200 OK  { sent_to: N }</text>
<line x1="860" y1="800" x2="290" y2="800" stroke="#3a3f47" stroke-width="1.6" stroke-dasharray="6,4"/>
<path d="M 290 800 L 301 795 M 290 800 L 301 805" stroke="#3a3f47" stroke-width="1.6" fill="none"/>
<text x="575.0" y="794" text-anchor="middle" font-size="11.5" font-weight="400" fill="#6b7280">200 OK  { ticket }</text>
<line x1="290" y1="834" x2="100" y2="834" stroke="#3a3f47" stroke-width="1.6" stroke-dasharray="6,4"/>
<path d="M 100 834 L 111 829 M 100 834 L 111 839" stroke="#3a3f47" stroke-width="1.6" fill="none"/>
<text x="195.0" y="828" text-anchor="middle" font-size="11.5" font-weight="400" fill="#6b7280">200 OK  { ticket }</text>
<line x1="90" y1="970" x2="130" y2="970" stroke="#23262b" stroke-width="1.6"/>
<path d="M 130 970 L 119 965 L 119 975 Z" fill="#23262b"/>
<text x="138" y="974" font-size="11" fill="#23262b">synchronous HTTP call</text>
<line x1="340" y1="970" x2="380" y2="970" stroke="#6b7280" stroke-width="1.6" stroke-dasharray="6,4"/>
<path d="M 380 970 L 369 965 M 380 970 L 369 975" stroke="#6b7280" stroke-width="1.6" fill="none"/>
<text x="388" y="974" font-size="11" fill="#23262b">HTTP response</text>
<line x1="560" y1="970" x2="600" y2="970" stroke="#2f6f4f" stroke-width="1.6"/>
<path d="M 600 970 L 589 965 M 600 970 L 589 975" stroke="#2f6f4f" stroke-width="1.6" fill="none"/>
<text x="608" y="974" font-size="11" fill="#2f6f4f" font-weight="600">async WebSocket push (real-time)</text>
</svg>