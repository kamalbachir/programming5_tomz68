<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Cinema Booking</title>
  <script>document.write('<link rel="stylesheet" href="styles.css?t=' + Date.now() + '">');</script>
</head>
<body>
<div class="container">
  <h1>🎬 Cinema Booking</h1>
  <p class="subtitle">Choose how you'd like to continue</p>

  <a class="role-card" href="customer.html">
    <span class="role-icon">🎟️</span>
    <span>
      <span class="role-title">Customer</span>
      <span class="role-desc">Browse movies and book a seat</span>
    </span>
  </a>

  <a class="role-card" href="staff.html">
    <span class="role-icon">🛠️</span>
    <span>
      <span class="role-title">Staff</span>
      <span class="role-desc">Manage movies, showtimes and tickets</span>
    </span>
  </a>
</div>

<script>
// Browsers can hold on to an old cached copy of customer.html/staff.html
// even after the files change. Adding a fresh, unique query string forces
// a real reload every time, instead of a stale cached page.
document.querySelectorAll(".role-card").forEach(a => {
  a.href = a.getAttribute("href").split("?")[0] + "?t=" + Date.now();
});
</script>
</body>
</html>
