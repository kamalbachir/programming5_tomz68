<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Cinema — Customer</title>
  <script>document.write('<link rel="stylesheet" href="styles.css?t=' + Date.now() + '">');</script>
</head>
<body>
<div class="container">
  <h1>🎬 Cinema Booking</h1>
  <p class="subtitle"><a class="back-link" id="homeLink" href="index.html">← Home</a> · Customer</p>

  <div id="loginCard" class="card">
    <h2>Login</h2>
    <div class="row">
      <span class="muted">Quick fill:</span>
      <button class="secondary" onclick="fill('alice')">alice</button>
      <button class="secondary" onclick="fill('bob')">bob</button>
    </div>
    <div class="row">
      <input id="nameInput" placeholder="username">
      <button onclick="login()">Login</button>
    </div>
    <p id="error" class="error"></p>
  </div>

  <div id="app" class="hidden">
    <p><span id="liveDot" class="live-dot"></span>Logged in as <b id="who"></b></p>

    <div class="card">
      <h2>Movies &amp; Showtimes</h2>
      <div id="moviesList"></div>
    </div>

    <div id="seatMapCard" class="card hidden">
      <h2 id="seatMapTitle">Pick a seat</h2>
      <div class="screen-label">SCREEN</div>
      <div class="screen-bar"></div>
      <div id="seatGrid"></div>
      <div class="legend">
        <span><span class="dot grey"></span>Available</span>
        <span><span class="dot red"></span>Taken</span>
      </div>
      <p id="seatMsg" class="error"></p>
    </div>

    <div class="card">
      <h2>My Bookings</h2>
      <ul id="myTickets"><li class="muted">No bookings yet</li></ul>
    </div>

    <div class="card">
      <h2>Live Activity</h2>
      <ul id="activity"><li class="muted">Waiting for events...</li></ul>
    </div>
  </div>
</div>

<script>
const GATEWAY = "http://localhost:8000";
const NOTIFY = "ws://localhost:8004/ws";
const ROWS = ["A", "B", "C", "D", "E"];
const COLS = [1, 2, 3, 4, 5, 6, 7, 8];
let me = "";
let currentShowtimeId = null;

homeLink.href = "index.html?t=" + Date.now();  // avoid a stale cached index page

function fill(user) { nameInput.value = user; }  // demo shortcut

async function login() {
  error.textContent = "";
  const name = nameInput.value.trim();
  if (!name) { error.textContent = "enter a username first"; return; }
  let r;
  try {
    r = await fetch(`${GATEWAY}/login`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ username: name }),
    });
  } catch (err) {
    error.textContent = "can't reach the server — is run_all.sh running?";
    return;
  }
  if (!r.ok) { error.textContent = "login failed"; return; }
  me = name;
  loginCard.classList.add("hidden");
  app.classList.remove("hidden");
  who.textContent = me;
  await loadMovies();
  connectWebSocket();
}

async function loadMovies() {
  const movies = await (await fetch(`${GATEWAY}/movies`)).json();
  moviesList.innerHTML = movies.map(m => `
    <div class="movie">
      <div class="title">${m.title}</div>
      <div class="row">
        ${m.showtimes.map(s =>
          `<button class="showtime-btn" id="st-${s.id}" onclick="selectShowtime(${s.id})">${s.time}</button>`
        ).join("")}
      </div>
    </div>`).join("") || `<p class="muted">No movies yet</p>`;

  // show a seat map right away so there's something to see
  if (currentShowtimeId === null && movies.length && movies[0].showtimes.length) {
    await selectShowtime(movies[0].showtimes[0].id);
  }
}

async function selectShowtime(showtimeId) {
  currentShowtimeId = showtimeId;
  document.querySelectorAll(".showtime-btn").forEach(b => b.classList.remove("selected"));
  const btn = document.getElementById(`st-${showtimeId}`);
  if (btn) btn.classList.add("selected");
  seatMapCard.classList.remove("hidden");
  seatMsg.textContent = "";
  await renderSeatGrid();
}

async function renderSeatGrid() {
  const bookings = await (await fetch(`${GATEWAY}/bookings`)).json();
  const taken = new Set(bookings.filter(t => t.showtime_id === currentShowtimeId).map(t => t.seat));
  seatGrid.innerHTML = ROWS.map(row => `
    <div class="seat-row">
      <span class="row-label">${row}</span>
      ${COLS.map(col => {
        const seat = row + col;
        const isTaken = taken.has(seat);
        return `<button class="seat ${isTaken ? "taken" : ""}" data-seat="${seat}"
                  onclick="bookSeat('${seat}')" ${isTaken ? "disabled" : ""}>${col}</button>`;
      }).join("")}
    </div>`).join("");
}

function markSeat(seat, taken) {
  const btn = seatGrid.querySelector(`[data-seat="${seat}"]`);
  if (!btn) return;
  btn.classList.toggle("taken", taken);
  btn.disabled = taken;
}

async function bookSeat(seat) {
  seatMsg.textContent = "";
  const r = await fetch(`${GATEWAY}/bookings`, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ username: me, showtime_id: currentShowtimeId, seat }),
  });
  const data = await r.json();
  if (!r.ok) { seatMsg.textContent = data.detail || "booking failed"; return; }
  markSeat(seat, true);
  if (myTickets.querySelector(".muted")) myTickets.innerHTML = "";
  const li = document.createElement("li");
  li.innerHTML = `<span>#${data.id} seat ${data.seat}</span><span class="status">booked</span>`;
  myTickets.prepend(li);
}

function connectWebSocket() {
  const ws = new WebSocket(NOTIFY);
  ws.onopen = () => liveDot.classList.add("on");
  ws.onclose = () => liveDot.classList.remove("on");
  ws.onmessage = (msg) => {
    const e = JSON.parse(msg.data);
    const taken = e.event === "seat_taken";
    if (e.showtime_id === currentShowtimeId) markSeat(e.seat, taken);

    if (activity.querySelector(".muted")) activity.innerHTML = "";
    const li = document.createElement("li");
    li.innerHTML = `<span>seat ${e.seat} (showtime ${e.showtime_id})</span>` +
      `<span class="status ${taken ? "" : "freed"}">${taken ? "booked" : "freed"}</span>`;
    activity.prepend(li);
    while (activity.children.length > 8) activity.removeChild(activity.lastChild);
  };
}
</script>
</body>
</html>
