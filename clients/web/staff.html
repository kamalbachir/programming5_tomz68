<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Cinema — Staff</title>
  <link rel="stylesheet" href="styles.css?v=2">
</head>
<body>
<div class="container">
  <h1>🎬 Cinema Booking</h1>
  <p class="subtitle"><a class="back-link" href="index.html">← Home</a> · Staff</p>

  <div id="loginCard" class="card">
    <h2>Login</h2>
    <div class="row">
      <span class="muted">Quick fill:</span>
      <button class="secondary" onclick="fill('staff1')">staff1</button>
      <button class="secondary" onclick="fill('staff2')">staff2</button>
    </div>
    <div class="row">
      <input id="nameInput" placeholder="username">
      <button onclick="login()">Login</button>
    </div>
    <p id="error" class="error"></p>
  </div>

  <div id="app" class="hidden">
    <p><span id="liveDot" class="live-dot"></span>Logged in as <b id="who"></b> (staff)</p>

    <div class="card">
      <h2>Add Movie</h2>
      <div class="row">
        <input id="movieTitle" placeholder="movie title">
        <button onclick="addMovie()">Add</button>
      </div>
    </div>

    <div class="card">
      <h2>Movies &amp; Showtimes</h2>
      <div id="moviesList"></div>
      <div class="row" style="margin-top:10px">
        <select id="movieSelect"></select>
        <input id="showtimeTime" placeholder="e.g. 20:00" style="width:100px">
        <button onclick="addShowtime()">Add Showtime</button>
      </div>
    </div>

    <div id="seatMapCard" class="card hidden">
      <h2>Seat Map — click a taken seat to cancel it</h2>
      <div class="screen-label">SCREEN</div>
      <div class="screen-bar"></div>
      <div id="seatGrid"></div>
      <div class="legend">
        <span><span class="dot grey"></span>Available</span>
        <span><span class="dot red"></span>Taken</span>
      </div>
    </div>

    <div class="card">
      <h2>Tickets</h2>
      <ul id="tickets"><li class="muted">No tickets yet</li></ul>
    </div>

    <div class="card">
      <h2>Live Activity</h2>
      <ul id="activity"><li class="muted">Waiting for events...</li></ul>
    </div>
  </div>
</div>

<script>
const GATEWAY = "http://localhost:8000";
const NOTIFY = "ws://localhost:8004/ws";
const ROWS = ["A", "B", "C", "D", "E"];
const COLS = [1, 2, 3, 4, 5, 6, 7, 8];
let me = "";
let currentShowtimeId = null;
let seatToTicket = {};  // seat -> ticket id, for the currently viewed showtime

function fill(user) { nameInput.value = user; }  // demo shortcut

async function login() {
  const r = await fetch(`${GATEWAY}/login`, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ username: nameInput.value }),
  });
  if (!r.ok) { error.textContent = "login failed"; return; }
  me = nameInput.value;
  loginCard.classList.add("hidden");
  app.classList.remove("hidden");
  who.textContent = me;
  await loadMovies();
  loadTickets();
  connectWebSocket();
}

async function loadMovies() {
  const movies = await (await fetch(`${GATEWAY}/movies`)).json();
  moviesList.innerHTML = movies.map(m => `
    <div class="movie">
      <div class="title">[${m.id}] ${m.title}</div>
      <div class="row">
        ${m.showtimes.map(s =>
          `<button class="showtime-btn" id="st-${s.id}" onclick="selectShowtime(${s.id})">${s.time}</button>`
        ).join("")}
      </div>
    </div>`).join("") || `<p class="muted">No movies yet</p>`;
  movieSelect.innerHTML = movies.map(m => `<option value="${m.id}">${m.title}</option>`).join("");

  if (currentShowtimeId === null && movies.length && movies[0].showtimes.length) {
    await selectShowtime(movies[0].showtimes[0].id);
  }
}

async function selectShowtime(showtimeId) {
  currentShowtimeId = showtimeId;
  document.querySelectorAll(".showtime-btn").forEach(b => b.classList.remove("selected"));
  const btn = document.getElementById(`st-${showtimeId}`);
  if (btn) btn.classList.add("selected");
  seatMapCard.classList.remove("hidden");
  await renderSeatGrid();
}

async function renderSeatGrid() {
  const bookings = await (await fetch(`${GATEWAY}/bookings`)).json();
  seatToTicket = {};
  bookings.filter(t => t.showtime_id === currentShowtimeId).forEach(t => seatToTicket[t.seat] = t.id);
  seatGrid.innerHTML = ROWS.map(row => `
    <div class="seat-row">
      <span class="row-label">${row}</span>
      ${COLS.map(col => {
        const seat = row + col;
        const isTaken = seat in seatToTicket;
        return `<button class="seat ${isTaken ? "taken" : ""}" data-seat="${seat}"
                  onclick="seatClicked('${seat}')">${col}</button>`;
      }).join("")}
    </div>`).join("");
}

function markSeat(seat, taken) {
  const btn = seatGrid.querySelector(`[data-seat="${seat}"]`);
  if (!btn) return;
  btn.classList.toggle("taken", taken);
}

async function seatClicked(seat) {
  const ticketId = seatToTicket[seat];
  if (!ticketId) return;  // empty seat: staff doesn't book on a customer's behalf
  await cancelTicket(ticketId);
}

async function addMovie() {
  const title = movieTitle.value.trim();
  if (!title) return;
  await fetch(`${GATEWAY}/movies`, {
    method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ title }),
  });
  movieTitle.value = "";
  loadMovies();
}

async function addShowtime() {
  const movieId = movieSelect.value;
  const time = showtimeTime.value.trim();
  if (!movieId || !time) return;
  await fetch(`${GATEWAY}/movies/${movieId}/showtimes`, {
    method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ time }),
  });
  showtimeTime.value = "";
  loadMovies();
}

async function loadTickets() {
  const list = await (await fetch(`${GATEWAY}/bookings`)).json();
  tickets.innerHTML = list.map(t => `
    <li>
      <span>#${t.id} ${t.username} — showtime ${t.showtime_id}, seat ${t.seat}</span>
      <button class="danger" onclick="cancelTicket(${t.id})">Cancel</button>
    </li>`).join("") || `<li class="muted">No tickets yet</li>`;
}

async function cancelTicket(id) {
  await fetch(`${GATEWAY}/bookings/${id}`, { method: "DELETE" });
  loadTickets();
}

function connectWebSocket() {
  const ws = new WebSocket(NOTIFY);
  ws.onopen = () => liveDot.classList.add("on");
  ws.onclose = () => liveDot.classList.remove("on");
  ws.onmessage = (msg) => {
    const e = JSON.parse(msg.data);
    const taken = e.event === "seat_taken";
    if (e.showtime_id === currentShowtimeId) {
      markSeat(e.seat, taken);
      if (taken && e.ticket) seatToTicket[e.seat] = e.ticket.id;
      else delete seatToTicket[e.seat];
    }

    if (activity.querySelector(".muted")) activity.innerHTML = "";
    const li = document.createElement("li");
    li.innerHTML = `<span>seat ${e.seat} (showtime ${e.showtime_id})</span>` +
      `<span class="status ${taken ? "" : "freed"}">${taken ? "booked" : "freed"}</span>`;
    activity.prepend(li);
    while (activity.children.length > 8) activity.removeChild(activity.lastChild);
    loadTickets();  // keep the ticket list live too
  };
}
</script>
</body>
</html>
